<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso 04 - Menú de Navegación</title>
    <style>
        /* Estilos generales para centrar el ejemplo en la pantalla */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: block;
            padding: 50px;
        }

        /* Contenedor principal de la barra de navegación */
        nav {
            background-color: #008ba3; /* Color turquesa de base */
            display: inline-table; /* Ajusta el ancho al contenido */
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* Sombra exterior */
            overflow: hidden;
            border: 1px solid #00687a;
        }

        /* Lista de elementos del menú */
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: table-row;
        }

        nav ul li {
            display: table-cell;
            border-right: 1px solid #00768a; /* Línea divisoria interna derecha */
            border-left: 1px solid #00a2be;  /* Efecto de relieve interno izquierdo */
        }

        /* Quitar bordes sobrantes en los extremos */
        nav ul li:first-child {
            border-left: none;
        }
        nav ul li:last-child {
            border-right: none;
        }

        /* Estilos para los enlaces (textos en forma horizontal) */
        nav ul li a {
            display: block;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 18px 28px;
            text-align: center;
            text-transform: uppercase;
            background-color: #0093af; /* Tono degradado o plano según la imagen */
            transition: background-color 0.3s ease;
        }

        /* Efecto al pasar el cursor (Opcional, mejora la experiencia) */
        nav ul li a:hover {
            background-color: #007c94;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Recursos</a></li>
            <li><a href="#">Contáctenos</a></li>
        </ul>
    </nav>

</body>
