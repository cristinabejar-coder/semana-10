<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso 7 </title>
    <style>
      
        @font-face {
            font-family: 'Lato';
            font-style: normal;
            font-weight: 400; 
            src: url('https://fonts.gstatic.com/s/lato/v24/S6uyw4BMUTPHjx4wWw.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Lato';
            font-style: normal;
            font-weight: 700; 
            src: url('https://fonts.gstatic.com/s/lato/v24/S6u9w4BMUTPHh6UvwsJ29g.woff2') format('woff2');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif; 
            background-color: #f9f9f9;
            color: #333333;
            padding: 40px;
            line-height: 1.6;
        }

        .contenedor-muestra {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            font-weight: 700;
            color: #111111;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            font-weight: 400; 
            font-size: 16px;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="contenedor-muestra">
        <h1>Demostración de Fuente: Lato</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi, fuga, consequatur harum nulla autem nostrum quae libero aperiam enim, commodi minima ipsum distinctio vitae repellendus reiciendis? Ipsa laborum deserunt similique?</p>
    </div>

</body>
</html>
