<!--
Eje02.- Crear una tarjeta de perfil.
con la siguientes caracteristicas:

insertar un bloque de tipo DIV con la clase "tarjeta"
dentro del bloque:
insertar un enbezado de tipo 3 (h3)

insertar un parrafo (p) texto: Desarrollador Web ...

en css debe usar las siguientes propiedades:
borde 3px grosor, doble linea y color #0099cc.

MODIFICAR LA TARJETA

<html lang="es">

    <div class="tarjeta">
